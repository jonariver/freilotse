<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Urlaubsplaner</title>
  <link rel="icon" href="./assets/logo/freilotse-favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/logo/freilotse-favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/logo/freilotse-favicon-16.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/logo/apple-touch-icon.png">
  <meta name="theme-color" content="#0B203A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FREILOTSE">
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
</head>
<body class="bg-slate-950">
  <div id="root"></div>
  <noscript>Bitte JavaScript aktivieren, um den Urlaubsplaner zu nutzen.</noscript>
  <script src="locales/de.js?v=18"></script>
  <!-- Reine Planungs-/Kalender-/Datenmodule (kein Modulsystem -> window.FREILOTSE.*,
       siehe CLAUDE.md, Abschnitt „Architektur/Module"). Reihenfolge untereinander
       ist größtenteils unkritisch, muss aber vor den JSX-Dateien geladen sein –
       AUSNAHME: js/puzzle.js setzt js/calendar.js UND js/planning.js voraus und
       muss deshalb nach beiden stehen (steht es hier bereits, da ans Ende
       angehängt). -->
  <script src="js/planning.js?v=1"></script>
  <script src="js/calendar.js?v=2"></script>
  <script src="js/data-sources.js?v=4"></script>
  <script src="js/share-link.js?v=2"></script>
  <script src="js/local-plans.js?v=1"></script>
  <script src="js/puzzle.js?v=1"></script>
  <script src="js/puzzle-stats.js?v=1"></script>
  <!-- Ausgelagerte JSX-Komponenten (über Babel-Standalone verarbeitet). Reihenfolge:
       common-components zuerst (keine Abhängigkeiten), dann support-components
       (SiteFooter/SiteLink), danach landing-page, legal-pages, about-page,
       changelog-page, guide-page und puzzle-page (alle nutzen Komponenten aus
       support-components; puzzle-page zusätzlich js/puzzle.js/js/puzzle-stats.js).
       app.jsx lädt zuletzt und mountet die App. -->
  <script type="text/babel" data-presets="react" src="jsx/common-components.jsx?v=1"></script>
  <script type="text/babel" data-presets="react" src="jsx/support-components.jsx?v=1"></script>
  <script type="text/babel" data-presets="react" src="jsx/landing-page.jsx?v=5"></script>
  <script type="text/babel" data-presets="react" src="jsx/legal-pages.jsx?v=4"></script>
  <script type="text/babel" data-presets="react" src="jsx/about-page.jsx?v=4"></script>
  <script type="text/babel" data-presets="react" src="jsx/changelog-page.jsx?v=2"></script>
  <script type="text/babel" data-presets="react" src="jsx/guide-page.jsx?v=2"></script>
  <script type="text/babel" data-presets="react" src="jsx/puzzle-page.jsx?v=4"></script>
  <script type="text/babel" data-presets="react" src="app.jsx?v=21"></script>
</body>
</html>
